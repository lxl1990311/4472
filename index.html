<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>大乱斗 · GOAT DRAFT</title>
<style>
  :root{
    --bg:#08090c;
    --panel:#0f1116;
    --panel2:#151821;
    --line:#222631;
    --line2:#2e3442;
    --txt:#dde1e8;
    --dim:#727b8c;
    --dim2:#49505d;
    --gold:#ffc857;
    --purple:#b06cff;
    --blue:#4f9dff;
    --gray:#8b95a5;
    --orange:#ff8a3d;
    --green:#3ddc97;
    --red:#ff5561;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
    font-size:14px;line-height:1.6;
    display:flex;justify-content:center;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 20% 0%,rgba(255,138,61,.07),transparent 45%),
      radial-gradient(circle at 85% 100%,rgba(79,157,255,.06),transparent 45%);
  }
  #app{
    width:100%;max-width:560px;min-height:100%;
    background:var(--panel);
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    padding:0 0 env(safe-area-inset-bottom);
  }
  @media(max-width:600px){#app{border:none}}

  /* ============ 通用 ============ */
  .pad{padding:20px}
  .kicker{font-size:9.5px;letter-spacing:.34em;color:var(--dim2);text-transform:uppercase}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:.16em;
    padding:14px;border-radius:5px;
    background:var(--orange);color:#08090c;
    transition:all .14s ease;
  }
  .btn:hover{background:#ffa15f;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line2);font-weight:400}
  .btn.ghost:hover{color:var(--txt);border-color:var(--dim);background:transparent}
  .btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

  /* ============ 顶部进度 ============ */
  .bar{
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(15,17,22,.94);
    backdrop-filter:blur(8px);z-index:10;
  }
  .bar .lg{font-size:10px;letter-spacing:.2em;color:var(--dim2)}
  .bar .lg b{color:var(--orange);font-weight:600}
  .bar .steps{margin-left:auto;display:flex;gap:4px}
  .bar .steps i{
    width:22px;height:3px;border-radius:2px;background:var(--line2);
    transition:background .25s;
  }
  .bar .steps i.on{background:var(--orange)}
  .bar .steps i.done{background:var(--orange);opacity:.45}

  /* ============ 标题页 ============ */
  .splash{padding:44px 26px 30px;display:flex;flex-direction:column;flex:1}
  .splash .t1{font-size:58px;font-weight:800;letter-spacing:.02em;line-height:1;margin:10px 0 0}
  .splash .t1 em{color:var(--orange);font-style:normal}
  .splash .t2{font-size:11px;letter-spacing:.4em;color:var(--dim2);margin-top:10px}
  .splash .t3{font-size:11px;letter-spacing:.26em;color:var(--dim2);opacity:.7;margin-top:9px}
  @media(max-width:420px){.splash .t1{font-size:46px}}
  .splash .desc{font-size:12.5px;color:var(--dim);line-height:1.95;margin:30px 0;border-left:2px solid var(--line2);padding-left:14px}
  .splash .desc b{color:var(--txt)}
  .splash .desc .o{color:var(--orange)}
  .splash .best{
    margin-top:24px;font-size:11px;color:var(--dim2);line-height:1.9;
  }
  .splash .best b{color:var(--gold)}
  .splash .note{font-size:10px;color:var(--dim2);line-height:1.7;opacity:.75}
  .splash .foot{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:9px}
  .disc{font-size:9.5px;letter-spacing:.16em;color:var(--dim2);opacity:.8;margin-top:14px}
  .checkbtn{
    font-family:inherit;font-size:10px;letter-spacing:.1em;color:var(--dim2);
    background:none;border:none;cursor:pointer;padding:3px 0;
    display:flex;align-items:center;gap:6px;transition:color .15s;
  }
  .checkbtn:hover{color:var(--txt)}
  .checkbtn i{
    width:6px;height:6px;border-radius:50%;background:var(--orange);display:block;
    box-shadow:0 0 7px rgba(255,138,61,.85);
  }
  .checkout{font-size:10px;line-height:1.75;color:var(--dim);text-align:center;letter-spacing:.02em}
  .checkout .cok{color:var(--gold);font-weight:700}
  .checkout .cbad{color:#ff6b6b;font-weight:700}

  /* ============ 选秀 ============ */
  .draft{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
  .roundinfo{display:flex;align-items:baseline;gap:10px;padding:0 2px}
  .roundinfo .pos{font-size:19px;font-weight:700;letter-spacing:.04em}
  .roundinfo .pos em{color:var(--orange);font-style:normal}
  .roundinfo .no{margin-left:auto;font-size:11px;color:var(--dim2);letter-spacing:.1em}

  /* ---- 抽签面板 ---- */
  .signno{margin-left:8px;font-size:10px;color:var(--dim2);letter-spacing:.06em;white-space:nowrap}
  .signpanel{
    border:1px solid var(--line2);border-radius:7px;
    background:linear-gradient(180deg,#151821,#101319);
    padding:14px;text-align:center;
  }
  .signtop{display:flex;gap:8px;margin-bottom:10px}
  .st,.se{
    border-radius:5px;padding:10px 8px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    background:#1b1f28;border:1px solid var(--line2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .st{flex:1;color:var(--orange)}
  .se{flex:0 0 auto;min-width:94px;color:var(--txt);font-size:15px}
  .st.q,.se.q{color:var(--dim2);letter-spacing:.16em;font-weight:400;font-size:14px}
  .signtip{font-size:11.5px;color:var(--dim);line-height:1.7}
  .drawbtn{
    width:100%;margin-top:13px;border:none;cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.42em;
    padding:13px;border-radius:6px;text-indent:.42em;
    background:var(--orange);color:#08090c;
    transition:all .14s;
  }
  .drawbtn:hover{background:#ffa15f;transform:translateY(-1px)}
  .rerolls{display:flex;gap:8px}
  .rb{
    flex:1;background:transparent;border:1px solid var(--line2);
    color:var(--txt);font-family:inherit;font-size:12px;
    padding:9px;border-radius:5px;cursor:pointer;transition:all .13s;
  }
  .rb:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
  .rb:disabled{opacity:.26;cursor:not-allowed}
  .remain{font-size:10.5px;color:var(--dim2);text-align:center;letter-spacing:.04em;margin-top:-3px}
  .remain.dead{color:var(--red);opacity:.65}

  /* ---- 球员卡位置按钮 ---- */
  .poses{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
  .postag{
    font-size:10px;letter-spacing:.08em;
    padding:3px 9px;border-radius:3px;
    background:rgba(255,138,61,.13);border:1px solid rgba(255,138,61,.45);
    color:var(--orange);
  }
  .postag.off{
    background:transparent;border-color:var(--line2);color:var(--dim2);
  }
  .card.sel{
    border-color:var(--orange);background:#1f1a15;
    transform:translateX(3px);
    box-shadow:inset 0 0 0 1px rgba(255,138,61,.28);
  }
  .card.sel::before{background:var(--orange)}
  .usedmark{font-size:9.5px;color:var(--dim2);letter-spacing:.1em;margin-left:3px}
  .card.dead{opacity:.3;filter:grayscale(.7)}
  .card.dead:hover{transform:none;border-color:var(--line2)}

  .cards{display:flex;flex-direction:column;gap:9px}

  .card{
    position:relative;
    background:var(--panel2);
    border:1px solid var(--line2);
    border-radius:7px;
    padding:13px 14px 12px 16px;
    cursor:pointer;
    transition:all .16s ease;
    overflow:hidden;
    animation:up .28s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gray);
  }
  .card.t-legend::before{background:var(--gold)}
  .card.t-star::before{background:var(--purple)}
  .card.t-pro::before{background:var(--blue)}
  .card.t-solid::before{background:var(--gray)}
  .card.t-legend{background:linear-gradient(100deg,#1d1910,#151821 55%)}
  .card.t-star{background:linear-gradient(100deg,#1a1421,#151821 55%)}
  .card:hover{border-color:var(--orange);transform:translateX(3px)}
  .card.t-legend:hover{border-color:var(--gold)}
  .card.t-star:hover{border-color:var(--purple)}
  .card:active{transform:translateX(3px) scale(.995)}

  .card .cbody{display:flex;align-items:flex-start;gap:12px}
  .card .cname{flex:1 1 auto;min-width:0}
  .card .cid{
    font-size:17px;font-weight:700;letter-spacing:.02em;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .card .rt{
    font-size:10px;padding:1px 5px;border-radius:2px;letter-spacing:.1em;font-weight:600;
  }
  .t-legend .rt{color:var(--gold);background:rgba(255,200,87,.13)}
  .t-star .rt{color:var(--purple);background:rgba(176,108,255,.13)}
  .t-pro .rt{color:var(--blue);background:rgba(79,157,255,.13)}
  .t-solid .rt{color:var(--gray);background:rgba(139,149,165,.12)}
  .card .meta{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.02em}
  .card .rate{
    flex:0 0 auto;text-align:right;
    font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;
    line-height:1.1;
  }
  .t-legend .rate{color:var(--gold)}
  .t-star .rate{color:var(--purple)}
  .t-pro .rate{color:var(--blue)}
  .t-solid .rate{color:var(--gray)}
  .card .rate small{display:block;font-size:9px;color:var(--dim2);letter-spacing:.14em;font-weight:400;margin-top:1px}

  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tags span{
    font-size:10px;color:var(--dim);
    border:1px solid var(--line2);border-radius:3px;
    padding:1px 6px;letter-spacing:.02em;
  }
  .fitline{margin-top:7px;font-size:10.5px;letter-spacing:.02em}
  .fit-good{color:var(--green)}
  .fit-mid{color:var(--gold)}
  .fit-bad{color:var(--red)}

  /* ============ 阵容栏 ============ */
  /* ---- 阵容槽位（在顶部，主要交互区） ---- */
  .lineup{display:flex;gap:5px;padding:0}
  .slot{
    flex:1;min-width:0;height:62px;
    border:1px solid var(--line2);border-radius:5px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;padding:4px 3px;
    background:#0d0f14;
    transition:all .16s ease;
    cursor:default;
  }
  .slot .sp{font-size:8.5px;letter-spacing:.09em;color:var(--dim2)}
  .slot .sn{
    font-size:10.5px;font-weight:600;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    line-height:1.25;
  }
  .slot .stier{font-size:8px;letter-spacing:.05em;font-weight:400}
  .slot.filled{background:var(--panel2);border-style:solid}
  .slot.filled.t-legend{border-color:rgba(255,200,87,.45);background:linear-gradient(180deg,#1d1910,#14171d)}
  .slot.filled.t-star{border-color:rgba(176,108,255,.4);background:linear-gradient(180deg,#1a1421,#14171d)}
  .slot.filled.t-pro{border-color:rgba(79,157,255,.35)}
  .slot.target{
    border-color:var(--orange);background:rgba(255,138,61,.13);
    cursor:pointer;animation:slotpulse 1.1s ease-in-out infinite;
  }
  .slot.target .sn{color:var(--orange)}
  @keyframes slotpulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,.35)}
    50%{box-shadow:0 0 0 4px rgba(255,138,61,.08)}
  }
  .slot.target:hover{background:rgba(255,138,61,.22)}
  .droptip{
    font-size:10.5px;color:var(--dim2);text-align:center;letter-spacing:.03em;
    min-height:16px;
  }
  .droptip.on{color:var(--orange)}
  .tier-legend{color:var(--gold)}
  .tier-star{color:var(--purple)}
  .tier-pro{color:var(--blue)}
  .tier-solid{color:var(--gray)}

  /* ============ 结算 ============ */
  .result{padding:26px 22px 30px;display:flex;flex-direction:column;flex:1}
  /* ---- 战绩大数字 ---- */
  .record{display:flex;align-items:baseline;gap:11px;margin:14px 0 0;line-height:.82}
  .rw{font-size:78px;font-weight:800;letter-spacing:-.03em;color:var(--gold);font-variant-numeric:tabular-nums}
  .runit{font-size:12px;color:var(--dim);letter-spacing:.16em;padding-bottom:9px}
  .rsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .gpill{
    font-size:12px;font-weight:800;letter-spacing:.06em;
    border:1px solid currentColor;border-radius:4px;padding:1px 7px;
  }
  .rtext{font-size:11px;color:var(--dim);letter-spacing:.03em}
  .majors{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .mj{
    font-size:10.5px;letter-spacing:.05em;padding:3px 9px;border-radius:3px;
    border:1px solid var(--line2);color:var(--dim);
  }
  .mj.champ{color:var(--gold);border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.08)}
  .mj.final{color:var(--blue);border-color:rgba(79,157,255,.42)}
  .mj.semi{color:var(--dim)}
  .mj.out{color:var(--red);border-color:rgba(255,85,97,.28)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .pill{
    font-size:10.5px;color:var(--dim);
    border:1px solid var(--line2);border-radius:20px;padding:2px 10px;
  }
  .bestmark{font-size:10px;color:var(--gold);letter-spacing:.2em;margin-top:11px}

  /* ---- 赛季数据 ---- */
  .stats{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .strow{display:flex;align-items:center;gap:10px;background:var(--panel);padding:9px 11px}
  .strow.iscore{background:linear-gradient(90deg,#1c1710,#0f1116 72%)}
  .stpos{font-size:9px;color:var(--dim2);letter-spacing:.08em;width:26px;flex:0 0 auto}
  .stmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .stname{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .stline{font-size:9.5px;color:var(--dim2)}
  .stright{flex:0 0 auto;min-width:92px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .strating{font-size:17px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.05}
  .strating span{display:block;font-size:7px;color:var(--dim2);letter-spacing:.14em;font-weight:400;text-align:right}
  .strsub{font-size:8.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .honor{
    font-size:8.5px;letter-spacing:.04em;padding:0 4px;border-radius:2px;
    border:1px solid var(--line2);color:var(--dim);font-weight:400;
  }
  .wrank{
    font-size:9px;letter-spacing:.04em;padding:0 5px;border-radius:2px;
    background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.5);
    color:var(--gold);font-weight:700;
  }
  .honor.mvp{color:var(--gold);border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.1)}
  .honor.evp{color:var(--blue);border-color:rgba(79,157,255,.4);background:rgba(79,157,255,.08)}

  .rgrade{
    display:flex;align-items:flex-end;gap:14px;
    margin:8px 0 4px;
  }
  .rgrade .big{
    font-size:76px;font-weight:800;line-height:.85;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .rgrade .unit{font-size:12px;color:var(--dim2);letter-spacing:.2em;padding-bottom:8px}
  .rgrade .lv{
    margin-left:auto;text-align:right;padding-bottom:6px;
  }
  .rgrade .lv .g{font-size:26px;font-weight:800;letter-spacing:.04em;line-height:1}
  .rgrade .lv .lb{font-size:9px;color:var(--dim2);letter-spacing:.24em;margin-top:4px}

  .g-SP{color:#ff5ec4;text-shadow:0 0 22px rgba(255,94,196,.35)}
  .g-S{color:var(--gold);text-shadow:0 0 20px rgba(255,200,87,.3)}
  .g-A{color:var(--green);text-shadow:0 0 18px rgba(61,220,151,.25)}
  .g-B{color:var(--blue)}
  .g-C{color:var(--dim)}
  .g-D{color:var(--red)}

  .verdict{
    font-size:13px;line-height:1.9;color:var(--txt);
    background:var(--panel2);border-left:2px solid var(--orange);
    padding:12px 14px;border-radius:0 4px 4px 0;
    margin:18px 0;
    white-space:pre-wrap;
  }
  .sec{font-size:9.5px;letter-spacing:.26em;color:var(--dim2);margin:20px 0 9px}
  .secnote{font-size:9px;letter-spacing:.02em;color:var(--dim2);margin-left:9px;opacity:.8}
  .rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .row{display:flex;align-items:center;gap:10px;background:var(--panel);padding:9px 12px;font-size:12px}
  .row .rn{flex:1;color:var(--dim)}
  .row .rv{font-variant-numeric:tabular-nums;font-weight:600}
  .pos-v{color:var(--green)}
  .neg-v{color:var(--red)}
  .zero-v{color:var(--dim2)}

  /* ---- 选核心 / 选战术 ---- */
  .stage{padding:18px 16px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
  .stageh{font-size:17px;font-weight:700;letter-spacing:.02em}
  .staged{font-size:11.5px;color:var(--dim);line-height:1.75;margin-top:-6px}

  .coregrid{display:flex;flex-direction:column;gap:7px}
  .corecard{
    display:flex;align-items:center;gap:10px;
    background:var(--panel2);border:1px solid var(--line2);
    border-radius:6px;padding:11px 13px;cursor:pointer;
    transition:all .14s;position:relative;overflow:hidden;
  }
  .corecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gray)}
  .corecard.t-legend::before{background:var(--gold)}
  .corecard.t-star::before{background:var(--purple)}
  .corecard.t-pro::before{background:var(--blue)}
  .corecard:hover{border-color:var(--orange);transform:translateX(2px)}
  .corecard.sel{border-color:var(--orange);background:#1e1a16}
  .ccpos{font-size:9.5px;color:var(--dim2);letter-spacing:.1em;width:46px;flex:0 0 auto}
  .ccname{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ccmeta{font-size:10px;color:var(--dim2);flex:0 0 auto}

  .tacgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .taccard{
    background:var(--panel2);border:1px solid var(--line2);border-radius:6px;
    padding:10px 9px;cursor:pointer;transition:all .14s;position:relative;
    min-height:86px;display:flex;flex-direction:column;gap:4px;
  }
  .taccard:hover:not(.locked){border-color:var(--orange);transform:translateY(-1px)}
  .taccard.sel{border-color:var(--orange);background:#1e1a16;box-shadow:inset 0 0 0 1px var(--orange)}
  .taccard.locked{opacity:.3;cursor:not-allowed;background:transparent}
  .taccard .tn{font-size:12.5px;font-weight:700;letter-spacing:.01em;color:var(--txt)}
  .taccard .td{font-size:9.5px;color:var(--dim);line-height:1.5}
  .taccard .lock{
    position:absolute;top:5px;right:5px;font-size:8px;letter-spacing:.04em;
    color:var(--dim2);border:1px solid var(--line2);border-radius:2px;padding:0 3px;
  }
  .stageacts{display:flex;gap:8px;margin-top:auto;padding-top:12px}
  .stageacts .btn{margin:0}
  .stageacts .btn.ghost{flex:0 0 96px}

  .coremark{
    font-size:9px;color:var(--orange);border:1px solid rgba(255,138,61,.45);
    border-radius:2px;padding:0 4px;margin-left:6px;letter-spacing:.06em;vertical-align:1px;
  }

function tierOf(r, t20){
  // 有 HLTV TOP20 排名就按名次定档（权威依据）
  if(t20){
    if(t20 <= 3)  return 'legend';   // 年度前三
    if(t20 <= 10) return 'star';     // 年度前十
    return 'pro';                    // 入榜前二十
  }
  // 没有榜单数据的年份，退回按 rating 估
  if(r>=1.26) return 'legend';
  if(r>=1.20) return 'star';
  if(r>=1.12) return 'pro';
  return 'solid';
}

/* 数据自检：阵容五位置是否齐全、同队是否有重复五人 */
function selfCheck(){
  const need = ['awp','entry','igl','support','lurker'];
  let teams = 0, squads = 0, entries = 0, badFit = 0, dup = 0;
  Object.keys(SQUADS).forEach(t=>{
    teams++;
    const seen = {};
    Object.keys(SQUADS[t]).forEach(e=>{
      squads++;
      const list = SQUADS[t][e];
      entries += list.length;
      const cov = new Set();
      list.forEach(p=>p.p.forEach(k=>cov.add(k)));
      if(need.some(k=>!cov.has(k))) badFit++;
      const key = list.map(p=>p.n).sort().join('|');
      if(seen[key]) dup++;
      seen[key] = e;
    });
  });
  return {teams, squads, entries, badFit, dup, ok: !badFit && !dup};
}

function startDraft(){

/* 该选手还能放哪些空位 */
function openPos(pl){
  return pl.p.filter(k=>!S.slots[k]);
}
/* 这个队这个年代还有没有人能用 */
function squadUsable(team, era){
  return SQUADS[team][era].some(pl=>!S.used.has(pl.n) && openPos(pl).length>0);
}

/* 抽签。keepTeam / keepEra 传值表示保持该维度
   返回 true = 抽到了「确实能出人」的签；false = 这个维度下已抽不出能填的人，原签保留 */
function drawSquad(keepTeam, keepEra, avoid){
  const prev = S.draw || null;
  function collect(ignoreUsed){
    const list = [];
    Object.keys(SQUADS).forEach(t=>{
      if(keepTeam && t !== keepTeam) return;
      Object.keys(SQUADS[t]).forEach(e=>{
        if(keepEra && e !== keepEra) return;
        if(ignoreUsed){
          if(!SQUADS[t][e].some(pl=>openPos(pl).length>0)) return;
        } else {
          if(!squadUsable(t, e)) return;
        }
        list.push({team:t, era:e});
      });
    });
    return list;
  }
  let list = collect(false);
  if(!list.length) list = collect(true);
  if(!list.length){                       // 极端兜底：放宽维度限制
    Object.keys(SQUADS).forEach(t=>{
      Object.keys(SQUADS[t]).forEach(e=>{
        if(SQUADS[t][e].some(pl=>openPos(pl).length>0)) list.push({team:t, era:e});
      });
    });
  }
  // 整签重抽时排除当前这一签，避免原地不动
  if(avoid && list.length > 1){
    const f = list.filter(x=>!(x.team===avoid.team && x.era===avoid.era));
    if(f.length) list = f;
  }
  // 抽到的签必须真的有人能填当前空位：抽到全灰的就丢掉重抽，抽完为止
  const pool = list.slice();
  while(pool.length){
    const cand = PICK(pool);
    pool.splice(pool.indexOf(cand), 1);
    if(squadUsable(cand.team, cand.era)){
      S.draw = cand;
      S.notice = '';
      return true;
    }
  }
  S.draw = prev;                          // 一个都出不了人：保留原签，不把界面抽空
  return false;
}

function renderPlayerList(list){
  const box = $('cards');
  if(!box) return;


  // 能用的排前面，同档按 rating 降序
  const sorted = list.slice().sort((a,b)=>{
    const oa = (!S.used.has(a.n) && openPos(a).length) ? 1 : 0;
    const ob = (!S.used.has(b.n) && openPos(b).length) ? 1 : 0;
    if(oa !== ob) return ob - oa;
    return b.r - a.r;
  });

  sorted.forEach((pl,i)=>{
    const used = S.used.has(pl.n);
    const opens = openPos(pl);
    const t20 = t20Of(pl, S.draw.era);
    const t = tierOf(pl.r, t20);
    const d = document.createElement('div');
    const usable = opens.length && !used;
    d.className = 'card t-' + t + (usable ? '' : ' dead') + (S.picked && S.picked.n === pl.n ? ' sel' : '');
    d.style.animationDelay = (i*45)+'ms';

    const posTags = pl.p.map(k=>{
      const free = !S.slots[k] && !used;
      return `<span class="postag ${free?'':'off'}">${POS_MAP[k].en}</span>`;
    }).join('');
    const mark = used
      ? '<span class="emptymark">已选</span>'
      : (!opens.length ? '<span class="emptymark">无空位</span>' : '');

    d.innerHTML = `
      <div class="cbody">
        <div class="cname">
          <div class="cid"><span class="rt">${TIER_NAME[t]}${t20?` #${t20}`:''}</span>${pl.n}</div>
          <div class="meta">${pl.c}</div>
        </div>
      </div>
      <div class="poses">${posTags}${mark}</div>`;

    if(usable){
      d.onclick = ()=> selectPlayer(pl, d, box);
    }
    box.appendChild(d);
  });
}

function renderLineup(){
  const box = $('lineup');
  if(!box) return;
  box.innerHTML = POS.map(p=>{
    const s = S.slots[p.k];
    if(s){
      const t = tierOf(s.r, t20Of(s, s.era));
      return `<div class="slot filled t-${t}">
        <span class="sp">${POS_ABBR[p.k]}</span>
        <span class="sn">${s.n}</span>
        <span class="stier tier-${t}">${TIER_NAME[t]}</span>

/* 选中一个人，等着点位置。只剩一个空位就直接放进去 */
function selectPlayer(pl, el, box){
  const opens = openPos(pl);
  S.picked = { n:pl.n, r:pl.r, c:pl.c, p:pl.p, team:S.draw.team, era:S.draw.era };
  if(opens.length === 1){
    pickInto(opens[0]);
    return;
  }
  box.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  renderLineup();
  const tip = $('droptip');
  if(tip){
    const names = opens.map(k=>POS_ABBR[k]).join(' / ');
    tip.textContent = `${pl.n} 能打 ${names}，点上方位置`;
    tip.classList.add('on');
  }
}

function pickInto(posKey){
  const pl = S.picked;
  if(!pl || S.slots[posKey]) return;
  S.slots[posKey] = { n:pl.n, r:pl.r, c:pl.c, p:pl.p, t:pl.team, era:pl.era };
  S.used.add(pl.n);
  S.picked = null;
  S.notice = '';
  S.round++;
  S.draw = null;
  if(S.round >= 5){ renderCoreSelect(); }
  else { renderSign(); }
}

/* 位置契合：p[0] 是本职，往后依次打折 */
function fitOf(pl, posKey){
  const idx = (pl.p || []).indexOf(posKey);
  if(idx === 0) return {v:1.0,  txt:'本职'};
  if(idx > 0)   return {v:.93, txt:'次选位'};
  return {v:.70, txt:'客串'};
}


function calcResult(){
  const picks = POS.map(p=>({pos:p, pl:S.slots[p.k], fit:fitOf(S.slots[p.k], p.k)}));

  // 个人贡献
  let total = 0;
  picks.forEach(x=>{
    total += x.pl.r * x.pos.w * x.fit.v;
  });
  const avg = total / 5;
  const teamAvgR = picks.reduce((s,x)=>s+x.pl.r,0) / 5;

  /* ---------- 战术契合：扬长避短 ---------- */
  const tmod = (S.tactic && !S.tactic.locked) ? (S.tactic.mod || {}) : {};
  const hasTac = Object.keys(tmod).length > 0;
  let tacBonus = 0;
  const tacDetail = [];
  if(hasTac){
    picks.forEach(x=>{
      const m = tmod[x.pos.k] || 1;
      if(m === 1) return;
      const rel = x.pl.r - teamAvgR;          // 相对队内平均
      const v = rel * (m - 1) * 70;
      tacBonus += v;
      tacDetail.push({pos:x.pos.n, n:x.pl.n, v, up:m>1});
    });
    tacBonus = CLAMP(Math.round(tacBonus), -14, 14);
  }

  /* ---------- 核心是否名副其实 ---------- */
  const corePos = S.core;
  const corePl = corePos ? S.slots[corePos] : null;
  let coreBonus = 0, coreNote = '';
  if(corePl){
    const stronger = picks.filter(x=>x.pl.r > corePl.r + 0.005).length;
    if(stronger === 0){ coreBonus = 4; coreNote = '全队数据最好的那个人拿了核心位，资源给他没人有意见'; }
    else if(stronger === 1){ coreBonus = 1; coreNote = '有一个人的数据比核心更好，但他是愿意打配合的那种'; }
    else if(stronger === 2){ coreBonus = -2; coreNote = '队里有两个人的数据比核心更好，资源分配会出问题'; }
    else { coreBonus = -5; coreNote = '全队数据最差的那个当了核心，这个决定很难解释'; }
    // 位置特性
    if(corePos === 'igl'){ coreBonus += 2; coreNote += '；指挥当核心，体系更稳'; }
    else if(corePos === 'support'){ coreBonus -= 2; coreNote += '；辅助当核心，队里未必服'; }
  }
  coreBonus = CLAMP(coreBonus, -8, 8);

  // ---- 化学反应 ----
  const chem = [];
  let chemVal = 0;

  // 1. 同队
  const teamCount = {};
  picks.forEach(x=>{ teamCount[x.pl.t] = (teamCount[x.pl.t]||0)+1; });
  Object.keys(teamCount).forEach(t=>{
    const n = teamCount[t];
    if(n>=2){
      const add = n===2?5:n===3?9:n===4?13:18;
      chemVal += add;
      chem.push({n:`${mottoOf(t)} ×${n}`, v:add,
        d: n>=4 ? '同一套体系养出来的人。他们不用沟通就知道下一步。'
          : n===3 ? '三个人在同一个战术框架里待过，这是骨架。'
          : '至少不用重新学怎么说话。'});
    }
  });

  // 2. 同国（避开与同队重复计算）
  const cCount = {};
  picks.forEach(x=>{ cCount[x.pl.c] = (cCount[x.pl.c]||0)+1; });
  Object.keys(cCount).forEach(c=>{
    const n = cCount[c];
    if(n < 2) return;
    const inSameTeam = Math.max(0, ...Object.keys(teamCount).map(t=>
      picks.filter(x=>x.pl.t===t && x.pl.c===c).length));
    const net = n - inSameTeam;
    if(net >= 1){
      const add = net >= 3 ? 3 : 2;
      chemVal += add;
      chem.push({n:`同国 · ${c} ×${n}`, v:add, d:'母语沟通，叫点不用翻译。'});
    }
  });

  // 3. 时代跨度
  const eras = picks.map(x=>parseInt(x.pl.era));
  const spread = Math.max(...eras) - Math.min(...eras);
  if(spread <= 3){
    chemVal += 3;
    chem.push({n:'同时代', v:3, d:'同一个版本的 CS，同一套理解。'});
  }

  // 4. 传奇过多：资源不够分
  const legends = picks.filter(x=>tierOf(x.pl.r, t20Of(x.pl, x.pl.era))==='legend').length;
  if(legends >= 3){
    chemVal -= 4;
    chem.push({n:'传奇过多 · 一个残局', v:-4, d:'三个人都觉得自己该拿最后那一枪。连经济都要抢。'});
  } else if(legends === 2){
    chemVal += 1;
    chem.push({n:'双核驱动', v:1, d:'两个能打的，剩下三个愿意干活。这个比例刚好。'});
  }

  // 5. 指挥权威：看 HLTV 年度最佳指挥，其次看是否进 TOP20；都不沾就不加不减
  const iglX = picks.find(x=>x.pos.k==='igl');
  const igl = iglX.pl;
  const iglEra = igl.era || '';
  if(IGL_AWARD[iglEra] === igl.n){
    chemVal += 3;
    chem.push({n:'年度最佳指挥', v:3, d:`${iglEra} 年 HLTV 的 IGL of the Year。他喊一句，五个人都动。`});
  } else if(t20Of(igl, iglEra)){
    chemVal += 2;
    chem.push({n:'指挥入榜', v:2, d:`${igl.n} 那年进了 TOP20，他的价值不光在数据表上。`});
  }

  // 软上限：正常构筑下不会触顶，保证明细之和 = 总分
  chemVal = CLAMP(chemVal, -10, 30);

  // 位置契合：次选位轻微扣减（已经乘进 avg 里，这里只做记录）
  const badFit = picks.filter(x=>x.fit.v<0.95).length;

  // 总分：avg 区间窄（1.26~1.45），化学反应才是主要分数轴
  let score = Math.round(62 + (avg - 1.30) * 130 + chemVal * 1.5 + tacBonus + coreBonus);
  score = CLAMP(score, 1, 130);

  return {picks, avg, teamAvgR, chem, chemVal, score, badFit,
          tacBonus, tacDetail, coreBonus, coreNote, corePos};
}

/* 一年 8 站：卡托、科隆各一站，Major 两届，其余为大型赛事 */
const EVENTS = [
  {n:'IEM 达拉斯',      s:'达拉斯',   lo:66, hi:78, g:2},
  {n:'BLAST 春季决赛',  s:'BLAST春',  lo:68, hi:80, g:2},

  {n:'MAJOR · 冬季',    s:'MAJOR冬',  lo:81, hi:96, g:3, major:true}
];

/* 对手梯度：弱 → 强。普通站 2 场，Major 3 场
   每场从对应比例段里抽队，同一站不派同一支队两次 */
function bracket(lo, hi, cnt){
  const pool = TEAMS.filter(t=>t.pw>=lo && t.pw<=hi).slice().sort((a,b)=>a.pw-b.pw);
  const n = pool.length;
  if(!n) return [];
  const used = new Set();
  /* 在 [lo2,hi2] 里找一个没被用过的下标，找不到返回 -1 */
  const pickFrom = (lo2, hi2)=>{
    const free = [];
    for(let i=lo2; i<=hi2; i++) if(!used.has(i)) free.push(i);
    return free.length ? free[Math.floor(Math.random()*free.length)] : -1;
  };
  const segs = cnt === 2
    ? [[0,.55],[.45,1]]
    : [[0,.45],[.3,.78],[.6,1]];
  const out = [];
  segs.slice(0, cnt).forEach(([a,b])=>{
    let lo2 = Math.floor(a * n);
    let hi2 = Math.min(n-1, Math.max(lo2, Math.ceil(b * n) - 1));
    let idx = pickFrom(lo2, hi2);
    if(idx < 0) idx = pickFrom(0, n-1);   // 这一段抽干了，放宽到全池
    if(idx < 0) idx = RI(0, n-1);         // 池子比场次还少，只能重复
    used.add(idx);
    out.push(pool[idx]);
  });
  return out;
}

function bo3(p){
  let w=0, l=0;
  const arr = [];
  while(w<2 && l<2){
    const r = Math.random() < p;
    arr.push(r);
    r ? w++ : l++;
  }
  return {win: w>=2, sc: w+':'+l, arr};
}

function simulateSeason(score){
  const out = [];
  let titles = 0, finals = 0;
  EVENTS.forEach(ev=>{
    const total = ev.g || 2;
    const opps = bracket(ev.lo, ev.hi, total);
    const games = [];
    let wins = 0;
    for(let i=0;i<total;i++){
      const opp = opps[i];
      const p = 1 / (1 + Math.pow(10, (opp.pw - score)/24));
      const res = bo3(p);
      games.push({opp, ...res});
      if(res.win) wins++;
      else break;               // 输一场就出局
    }
    let place, cls;
    if(wins === total){ place = '冠军'; cls = 'champ'; titles++; }
    else if(wins === total-1){ place = '亚军'; cls = 'final'; finals++; }
    else if(wins === 1){ place = total===3 ? '八强' : '四强'; cls = 'semi'; }
    else { place = '出局'; cls = 'out'; }
    out.push({ev, games, wins, place, cls});
  });
  return {events: out, titles, finals};
}

/* 评级：分数定档；但一个赛季把两个 Major 都拿下，直接算王朝 —— 这个成绩不需要用评分解释 */
function gradeOf(s, majors){
  if((majors || 0) >= 2) return {g:'S+', lb:'王 朝 阵 容', cls:'g-SP'};
  if(s>=94) return {g:'S+', lb:'王 朝 阵 容', cls:'g-SP'};
  if(s>=86) return {g:'S',  lb:'MAJOR 冠军', cls:'g-S'};
  if(s>=77) return {g:'A',  lb:'顶级强队', cls:'g-A'};
  if(s>=67) return {g:'B',  lb:'一线队伍', cls:'g-B'};
  if(s>=57) return {g:'C',  lb:'二线水平', cls:'g-C'};
  return {g:'D', lb:'网吧五连坐', cls:'g-D'};
}

        lines.push(`${n} 站 ${season.titles} 冠。这一年没什么可说的，他们只是在收奖杯。`);
      } else if(season.titles >= 5){

      } else if(season.titles >= 3){

        lines.push('一整年，一个决赛都没进。这个赛季会被忘掉，连回顾视频都不会做。');

        lines.push(`进过 ${season.finals} 次决赛，一个冠军都没拿到。最难看的不是输，是每次都差一点。`);

      } else {

      }
    }
  }

  return lines.join('\n');
}

/* 每人一份赛季数据 */
function buildStats(r){
  const titles = r.season ? r.season.titles : 0;
  const base = r.picks.map(x=>{
    const rating = x.pl.r + (Math.random()-0.5)*0.03;
    // 赛季末世界排名：个人表现 + 队伍冠军数
    return { x, rating, perf: rating + titles * 0.008 };
  });
  /* TOP20 名次是唯一的：按表现从高到低依次占位，一个名次不会发给两个人。
     档位内随机取空位；本档占满就顺延到榜尾的空位，取不到就干脆不进榜。 */
  const taken = new Set();
  const rankOf = new Map();
  base.slice().sort((a,b)=>b.perf-a.perf).forEach(row=>{
    const band = row.perf >= 1.31 ? [1,3]
               : row.perf >= 1.26 ? [4,7]
               : row.perf >= 1.21 ? [8,13]
               : row.perf >= 1.16 ? [14,20]
               : null;
    if(!band){ rankOf.set(row, null); return; }
    const free = [];
    for(let i=band[0]; i<=band[1]; i++) if(!taken.has(i)) free.push(i);
    if(!free.length){
      for(let i=band[1]+1; i<=20; i++) if(!taken.has(i)) free.push(i);
    }
    if(!free.length){ rankOf.set(row, null); return; }
    const k = PICK(free);
    taken.add(k);
    rankOf.set(row, k);
  });
  const ps = base.map(row=>({
    rank: rankOf.get(row),
    pos: row.x.pos, pl: row.x.pl,
    rating: row.rating,
    kpr: 0.65 + (row.rating - 1.0) * 0.64 + (Math.random()-0.5)*0.035,
    kd:  1.00 + (row.rating - 1.0) * 1.15 + (Math.random()-0.5)*0.05,
    honors: []
  }));
  const sorted = ps.slice().sort((a,b)=>b.rating-a.rating);
  if(sorted[0]) sorted[0].honors.push({t:'MVP', c:'mvp'});
  if(sorted[1]) sorted[1].honors.push({t:'EVP', c:'evp'});
  ps.forEach(p=>{
    if(p.pos.k==='igl')     p.honors.push({t:'指挥核心', c:'h'});
    if(p.pos.k==='entry')   p.honors.push({t:'首杀王', c:'h'});
    if(p.pos.k==='lurker')  p.honors.push({t:'残局王', c:'h'});
    if(p.pos.k==='awp')     p.honors.push({t:'狙击手', c:'h'});
    if(p.pos.k==='support') p.honors.push({t:'无声功臣', c:'h'});
  });
  return ps;
}

      <div class="pills">
        <span class="pill">战术 · ${tacName}</span>
        <span class="pill">核心 · ${coreName}</span>
      </div>
      ${isBest?'<div class="bestmark">◆ 生涯最佳阵容</div>':''}

      <div class="sec">本 赛 季 数 据<span class="secnote">按 Rating 模拟</span></div>
      <div class="stats">${statRows}</div>

      <div class="verdict">${verdictOf(r)}</div>

      <div class="sec">赛 站 战 绩</div>
      <div class="season">${seasonRows}</div>

      <div class="sec">阵 容</div>
      <div class="finalteam">${teamRows}</div>

      <div class="sec">化 学 反 应</div>
      <div class="rows">${chemRows}</div>

      <div class="sec">数 据</div>
      <div class="rows">
        <div class="row"><span class="rn">阵容评分</span><span class="rv">${r.score} 分</span></div>
        <div class="row"><span class="rn">冠军 / 亚军（${r.season.events.length} 站）</span><span class="rv">${r.season.titles} / ${r.season.finals}</span></div>
        ${majors.map(m=>`<div class="row"><span class="rn">${m.ev.n}</span><span class="rv">${m.place}</span></div>`).join('')}
        <div class="row"><span class="rn">核心 · ${coreName}</span><span class="rv ${r.coreBonus>0?'pos-v':r.coreBonus<0?'neg-v':'zero-v'}">${r.coreBonus>0?'+':''}${r.coreBonus}</span></div>
        <div class="row"><span class="rn">战术 · ${tacName}</span><span class="rv ${r.tacBonus>0?'pos-v':r.tacBonus<0?'neg-v':'zero-v'}">${r.tacBonus>0?'+':''}${r.tacBonus}</span></div>
        <div class="row"><span class="rn">化学反应总分</span><span class="rv ${r.chemVal>0?'pos-v':r.chemVal<0?'neg-v':'zero-v'}">${r.chemVal>0?'+':''}${r.chemVal}</span></div>
        <div class="row"><span class="rn">位置错配</span><span class="rv ${r.badFit?'neg-v':'pos-v'}">${r.badFit} 人</span></div>
      </div>

      <div class="acts">
        <button class="btn" id="againBtn">再 抽 一 套</button>
        <button class="btn ghost" id="copyBtn">复制战绩</button>
      </div>
      <div class="sharebox" id="sharebox"></div>
      <div class="disc" style="text-align:center">非官方粉丝同人作品 · 仅供娱乐 · ${VERSION}</div>
    </div>`;

  $('againBtn').onclick = splash;

  const text = buildShareText(r, g);
  $('copyBtn').onclick = ()=>{
    const box = $('sharebox');
    box.style.display = 'block';
    box.textContent = text;
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(()=>{
        $('copyBtn').textContent = '已复制';
        setTimeout(()=>{ $('copyBtn').textContent='复制战绩'; }, 1600);
      }).catch(()=>{});
    }
  };
}

function buildShareText(r, g){
  const lines = [];
  lines.push(`【大乱斗】${r.season.titles} 冠 / ${r.season.events.length} 站　${r.score} 分 ${g.g} ${g.lb}`);
  lines.push('');
  r.picks.forEach(x=>{
    const core = x.pos.k === r.corePos ? ' ★' : '';
    lines.push(`${x.pos.n}  ${x.pl.n}  ${x.pl.r.toFixed(2)}${core}`);
  });
  lines.push('');
  lines.push(`战术：${S.tactic ? S.tactic.n : '—'}　化学反应 ${r.chemVal>0?'+':''}${r.chemVal}`);
  lines.push('');
  r.season.events.forEach(e=>{
    lines.push(`${e.ev.s}　${e.place}`);
  });
  return lines.join('\n');
}

/* ==========================================================
   启动
   ========================================================== */
splash();
</script>
</body>
</html>
